services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-download-app
    ports:
      - "3100:3000"
    restart: unless-stopped
    tmpfs:
      - /app/tmp:size=1024m,mode=1777
    volumes:
      - yt-dlp-cache:/var/cache/yt-dlp
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - YOUTUBE_DL_BIN=/usr/local/bin/yt-dlp
      - FFMPEG_BIN=/usr/bin/ffmpeg
      - YTDL_CACHE_DIR=/var/cache/yt-dlp
      - TMP_DOWNLOAD_DIR=/app/tmp
      - YTDL_META_CONCURRENCY=6
      - YTDL_DOWNLOAD_CONCURRENCY=4
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=youtube-downloader
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - GOMEMLIMIT=80MiB
    deploy:
      resources:
        limits:
          memory: 140M
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter (internal)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - GOMEMLIMIT=80MiB
    deploy:
      resources:
        limits:
          memory: 140M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    environment:
      - GOMEMLIMIT=96MiB
    deploy:
      resources:
        limits:
          memory: 192M
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GOMEMLIMIT=128MiB
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  yt-dlp-cache:
